name: Release

# Publishes the player archive tagged windows-VERSION (stable, or a pre-release when VERSION has a suffix), either from a pushed
# windows-* tag or by hand (Actions > Release > Run workflow).
# Runs on a GitHub-hosted runner: the binaries are already in the branch.
on:
  push:
    tags: ["windows-*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, without the windows- prefix (e.g. 1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('windows-{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the archive
        run: python3 packaging/windows/release_zip.py "${TAG#windows-}" dist
      - name: Check it with crowbar-check
        run: |
          pip install --quiet git+https://github.com/DiamondDogz/crowbar-sdk
          mkdir check && cd check && unzip -q ../dist/*.zip
          crowbar-check */ --json > report.json || true
          python3 -c "import json,sys; r=json.load(open('report.json')); print(json.dumps(r['errors'], indent=1)); sys.exit(0 if r['ok'] else 1)"
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(cut -d' ' -f1 dist/*.sha256)
          sed -e "s/@SHA256@/$sha/" -e "s/@VERSION@/${TAG#windows-}/" packaging/windows/release-notes.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version again (documents fixed): replace the archive, keep the tag.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            # windows-1.1 is a stable release; windows-1.1-beta.1 (a suffix) stays a pre-release.
            case "${TAG#windows-}" in *-*) kind=--prerelease ;; *) kind=--latest ;; esac
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" $kind --title "$TAG" --notes-file notes.md
          fi
